# DQ Core Engine configuration (local POC). Relative paths resolve against this file's folder.
# On Databricks, point paths at a Unity Catalog Volume / workspace folder (or use ${ENV_VARS}),
# e.g. base_path: /Volumes/main/dq/outputs  - see config/engine.databricks.yaml.
engine:
  name: dq-accelerator-poc
  default_mode: OBSERVE_ONLY          # first integration always starts in OBSERVE_ONLY
  include_dq_columns_in_accepted: false

  registry:
    backend: nosql             # file | sqlite | nosql (nosql = document store: tinydb|mongodb|dynamodb)
    db_path: ../data/registry.db              # used when backend=sqlite
    metadata:                                # used when backend=nosql
      engine: tinydb                         # tinydb (embedded) | mongodb | dynamodb
      db_path: ../data/metadata.nosql.json   # tinydb JSON document store
      # engine: mongodb → uri: mongodb://host:27017, db_name: dq_metadata
      # engine: dynamodb → region/table_prefix/endpoint_url (DynamoDB Local) / aws_profile
    rulesets_path: ../registry/rulesets       # used when backend=file
    pipelines_path: ../registry/pipelines     # used when backend=file
    enforce_published_immutability: true      # file content must match the published checksum
    require_published_for_enforcement: true   # ENFORCE / REMEDIATE only with published rule sets
    enforce_pipeline_lifecycle: true          # PAUSED / OFFBOARDED pipelines pass data through untouched

  profiling:
    mode: FULL                 # FULL | SAMPLE | APPROXIMATE
    sample_fraction: 0.10
    sample_seed: 42
    max_allowed_values: 20
    top_values: 10
    top_patterns: 5
    high_null_rate: 0.20
    dominant_value_rate: 0.90
    outlier_stddevs: 3.0
    semantic_match_rate: 0.80

  validation:
    cache_intermediate: true
    collect_failure_examples: true
    # Large-file auto-sampling: files above this size (MB) are sampled for DQ runs.
    # Set to 0 to disable. Override per-run via UI or env DQ_SAMPLE_THRESHOLD_MB.
    large_file_threshold_mb: 50
    large_file_sample_rows: 100000   # target row count after sampling

  ai:
    provider: dqx              # mock | dqx
    # mock  : MockAIProvider - SIMULATED outputs, no external calls, no credentials needed
    # dqx   : DQXProvider - real LLM via Databricks Model Serving; requires:
    #           pip install 'databricks-labs-dqx[llm]'
    #           env: DATABRICKS_HOST, DATABRICKS_TOKEN, DQX_MODEL_ENDPOINT
    #         auto-falls back to mock if package not installed or credentials absent
    mock_responses_path: ai/mock_ai_responses.yaml
    similarity_fallback: true
    dqx_model_endpoint: databricks-meta-llama-3-3-70b-instruct
    dqx_fallback_on_error: true

  # DQ Assistant chatbot — toggle from Settings page (edited in place, comments preserved)
  assistant:
    enabled: false
    log_path: ../logs/assistant/chat_log.jsonl   # one JSON per conversation turn

  # Alerting — webhook notifications on quality-gate failures / quarantine spikes
  alerts:
    enabled: false
    webhook_url: null                # Slack/Teams/any HTTP POST endpoint (JSON payload)
    events: [gate_fail]              # gate_fail | quarantine_threshold | always
    fail_pipeline: false             # true → halt pipeline when gate fails (post-report)
    timeout_seconds: 10
    min_quarantine_rate: 1.0         # quarantine_threshold fires at/above this rate (0.05 = 5%)

  outputs:
    base_path: ../data
    reports_path: ../reports
    format: parquet          # parquet | delta  (delta = ACID tables + _delta_log, queryable as catalog.schema.table)
    write_mode: overwrite
    # catalog: dq           # optional namespace: <base>/dq/bronze/<dataset>  ==  dq.bronze.<dataset>

  # Local Spark runtime tuning (used by UI backend + CLI local harness).
  # On Databricks/Fabric/EMR these are ignored — the cluster provides Spark.
  # Override any value via env var: DQ_DRIVER_MEMORY, DQ_SPARK_MASTER, DQ_SHUFFLE_PARTITIONS
  runtime:
    spark_master: local[4]
    driver_memory: 3g
    shuffle_partitions: 16
    # Executor memory only applies to standalone/cluster mode, not local[*]
    executor_memory: 2g

  logging:
    level: INFO
    json: true
