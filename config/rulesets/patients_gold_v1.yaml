ruleset:
  ruleset_id: patients_gold
  dataset: patients
  version: "1.0"
  stage: GOLD
  status: DRAFT
  description: Minimal Gold publication rules for the healthcare POC.
  owner: clinical-data-domain
  record_key: [patient_id]
  created_by: dq.engineer@health.example
  created_at: "2026-07-14T00:00:00Z"
  rules:
    - rule_id: PATG_001
      name: gold_patient_id_not_null
      description: Published patient rows must retain an identifier.
      column: patient_id
      rule_type: NOT_NULL
      severity: ERROR
    - rule_id: PATG_002
      name: gold_patient_id_unique
      description: Published patient identifiers must be unique.
      column: patient_id
      rule_type: UNIQUE
      severity: ERROR
    - rule_id: PATG_003
      name: gold_email_format
      description: Published contact emails must be structurally valid.
      column: contact_email
      rule_type: REGEX
      severity: ERROR
      config: {pattern: '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'}
