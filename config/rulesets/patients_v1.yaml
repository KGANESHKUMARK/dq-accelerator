# Patient RuleSet v1.0 - SYNTHETIC DEMO for the healthcare pipeline (mirrors customers_silver style).
# Published versions are immutable: create v1.1 for changes.
ruleset:
  ruleset_id: patients_silver
  dataset: patients
  version: "1.0"
  stage: SILVER
  status: PUBLISHED
  description: Silver-layer quality rules for the patient admissions feed (synthetic healthcare demo).
  owner: clinical-data-domain
  record_key: [patient_id]
  created_by: dq.engineer@health.example
  created_at: "2026-11-07T09:00:00Z"
  approved_by: clinical.steward@health.example
  approved_at: "2026-11-07T09:30:00Z"
  change_log:
    - Initial approved rule set for the synthetic patient admissions feed.
  rules:
    - rule_id: PAT_001
      name: patient_id_not_null
      description: Every patient record must have an identifier.
      column: patient_id
      rule_type: NOT_NULL
      severity: ERROR

    - rule_id: PAT_002
      name: no_exact_duplicate_records
      description: Exact duplicate patient records are removed (any identical survivor).
      rule_type: DUPLICATE
      severity: ERROR
      config: {keys: ALL_COLUMNS}
      remediation:
        deterministic:
          - action: DEDUPLICATE
            survivor: {strategy: ANY_IDENTICAL}

    - rule_id: PAT_003
      name: patient_id_unique
      description: A patient_id must identify exactly one patient (conflicts need human resolution).
      column: patient_id
      rule_type: UNIQUE
      severity: ERROR

    - rule_id: PAT_004
      name: mrn_not_null
      description: Medical record number is mandatory.
      column: mrn
      rule_type: NOT_NULL
      severity: ERROR

    - rule_id: PAT_005
      name: mrn_format
      description: MRN follows the pattern MRN999999.
      column: mrn
      rule_type: REGEX
      severity: ERROR
      config: {pattern: '^MRN[0-9]{6}$'}
      remediation:
        deterministic:
          - action: TRIM

    - rule_id: PAT_006
      name: patient_name_valid_characters
      description: Patient names contain letters, spaces, apostrophes, dots and hyphens only.
      column: patient_name
      rule_type: REGEX
      severity: ERROR
      config: {pattern: "^\\s*[A-Za-z][A-Za-z .'-]*$"}
      remediation:
        ai_assisted: {enabled: true, auto_apply: true}   # PHI column -> policy forces human approval

    - rule_id: PAT_007
      name: patient_name_no_edge_whitespace
      description: Names should not have leading or trailing whitespace.
      column: patient_name
      rule_type: REGEX
      severity: WARNING
      config: {pattern: '^\S(.*\S)?$'}
      remediation:
        deterministic:
          - action: TRIM

    - rule_id: PAT_008
      name: dob_iso_format
      description: Date of birth must be an ISO date (yyyy-MM-dd).
      column: dob
      rule_type: DATE_FORMAT
      severity: ERROR
      config: {format: yyyy-MM-dd}
      remediation:
        deterministic:
          - action: DATE_STANDARDIZATION
            input_formats: [dd/MM/yyyy, yyyy/MM/dd]
            output_format: yyyy-MM-dd

    - rule_id: PAT_009
      name: gender_allowed
      description: Gender must be M, F or OTHER.
      column: gender
      rule_type: ALLOWED_VALUES
      severity: ERROR
      config: {values: [M, F, OTHER]}
      remediation:
        deterministic:
          - action: TRIM
          - action: UPPERCASE
        ai_assisted: {enabled: true, auto_apply: true}

    - rule_id: PAT_010
      name: blood_type_allowed
      description: Blood type must be a valid ABO/Rh group.
      column: blood_type
      rule_type: ALLOWED_VALUES
      severity: ERROR
      config: {values: [A+, A-, B+, B-, AB+, AB-, O+, O-]}
      remediation:
        deterministic:
          - action: TRIM
          - action: UPPERCASE

    - rule_id: PAT_011
      name: admission_date_iso
      description: Admission date must be an ISO date (yyyy-MM-dd).
      column: admission_date
      rule_type: DATE_FORMAT
      severity: ERROR
      config: {format: yyyy-MM-dd}
      remediation:
        deterministic:
          - action: DATE_STANDARDIZATION
            input_formats: [dd/MM/yyyy, yyyy/MM/dd]
            output_format: yyyy-MM-dd

    - rule_id: PAT_012
      name: ward_not_null
      description: Ward is required; an approved placeholder may be used when unknown.
      column: ward
      rule_type: NOT_NULL
      severity: ERROR
      remediation:
        deterministic:
          - action: NULL_REPLACEMENT
            value: GENERAL
            approved: true
            approved_by: clinical.steward@health.example

    - rule_id: PAT_013
      name: ward_allowed
      description: Ward must be a real hospital ward.
      column: ward
      rule_type: ALLOWED_VALUES
      severity: ERROR
      config: {values: [ICU, GENERAL, EMERGENCY, MATERNITY, PEDIATRIC]}
      remediation:
        deterministic:
          - action: TRIM
          - action: UPPERCASE

    - rule_id: PAT_014
      name: diagnosis_code_icd10
      description: Diagnosis code must look like an ICD-10 code (e.g. J45.9).
      column: diagnosis_code
      rule_type: REGEX
      severity: ERROR
      config: {pattern: '^[A-Z][0-9]{2}(\.[0-9]{1,2})?$'}
      remediation:
        deterministic:
          - action: TRIM
          - action: UPPERCASE

    - rule_id: PAT_015
      name: insurance_status_allowed
      description: Insurance status must be a known coverage state.
      column: insurance_status
      rule_type: ALLOWED_VALUES
      severity: ERROR
      config: {values: [COVERED, SELF_PAY, PENDING, EXPIRED]}
      remediation:
        deterministic:
          - action: TRIM
          - action: UPPERCASE
        ai_assisted: {enabled: true, auto_apply: true}

    - rule_id: PAT_016
      name: contact_email_format
      description: Contact email must be syntactically valid.
      column: contact_email
      rule_type: REGEX
      severity: ERROR
      config: {pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'}
      remediation:
        deterministic:
          - action: TRIM
          - action: LOWERCASE
        ai_assisted: {enabled: true, auto_apply: false}   # contact data: corrections need review

    - rule_id: PAT_017
      name: admission_status_allowed
      description: Admission status must be a known encounter state.
      column: admission_status
      rule_type: ALLOWED_VALUES
      severity: ERROR
      config: {values: [ADMITTED, DISCHARGED, TRANSFERRED, OBSERVATION]}
      remediation:
        deterministic:
          - action: TRIM
          - action: UPPERCASE
        ai_assisted: {enabled: true, auto_apply: true}

    - rule_id: PAT_018
      name: patient_feed_schema
      description: The patient feed must provide exactly the agreed columns.
      rule_type: SCHEMA_VALIDATION
      severity: ERROR
      config:
        allow_extra_columns: false
        expected_columns:
          - {name: patient_id, type: string}
          - {name: patient_name, type: string}
          - {name: mrn, type: string}
          - {name: dob, type: string}
          - {name: gender, type: string}
          - {name: blood_type, type: string}
          - {name: admission_date, type: string}
          - {name: ward, type: string}
          - {name: diagnosis_code, type: string}
          - {name: insurance_status, type: string}
          - {name: contact_email, type: string}
          - {name: admission_status, type: string}
